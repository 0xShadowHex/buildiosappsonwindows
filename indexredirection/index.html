<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Build iOS apps on Windows</title>

    <meta property="og:site_name" content="Build iOS apps on Windows">
    <meta property="og:image" content="https://icodewin.vercel.app/ressources/project-icon.jpg">
    <meta name="description" content="build iOS apps on Windows free no mac">
    <link rel="icon" href="./ressources/background-overlay.jpg" type="image/x-icon">
    <style>
        body {
            margin: 0;
            background-color: #0e111b;
        }

        .container {
            color: whitesmoke;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 97vh;
        }

        h1 {
            color: dodgerblue;
            font-size: 2.5em;
            margin-bottom: 40px;
        }

        .button-link {
            display: inline-block;
            padding: 15px 30px;
            background-color: dodgerblue;
            color: #0e111b;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .button-link:hover {
            background-color: #1e90ff;
            transform: translateY(-2px);
        }

        .button-link:active {
            background-color: #007bff;
            transform: translateY(0);
        }

        .desc {
            color: rgba(245, 245, 245, 0.678);
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Build iOS apps on windows</h1>
        <a href="https://icodewin.vercel.app/" class="button-link">Start coding!</a>
    </div>
    <div class="desc">No login required, build iOS apps on any device for free, no mac needed!</div>
</body>

</html>
